    ; MotoGuard+ ESP32 firmware
;   esp32dev        SIM800L (2G) modem
;   esp32dev-a7670  A7670 / A7672 (4G LTE) modem
;   esp32dev-wifi   bench testing over WiFi; no SMS from the device, the server sends it instead

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Slower than the 460800 default but survives this board's flaky USB link ("chip stopped responding").
upload_speed = 115200
; WiFi + Bluetooth no longer fit the default 1.3 MB app slot. min_spiffs keeps two OTA slots of
; 1.9 MB each and the NVS partition where it was, so saved settings survive the switch.
board_build.partitions = min_spiffs.csv
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit MPU6050@^2.2.4
    vshymanskyy/TinyGSM@^0.12.0
    arduino-libraries/ArduinoHttpClient@^0.6.1
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^1.4.3

[env:esp32dev]
build_flags = -D TINY_GSM_MODEM_SIM800

[env:esp32dev-a7670]
build_flags = -D TINY_GSM_MODEM_A7672X

[env:esp32dev-wifi]
build_flags = -D USE_WIFI
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager@^2.0.17
